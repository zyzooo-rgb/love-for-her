<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff416c,#ff4b2b,#8e44ad,#3498db);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:420px;
    padding:40px;
    text-align:center;
    border-radius:25px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

h1{
    font-size:35px;
}

#typing{
    margin:25px 0;
    min-height:90px;
    font-size:20px;
    line-height:1.7;
}

.buttons{
    margin-top:20px;
    position:relative;
    height:80px;
}

button{
    border:none;
    padding:14px 30px;
    border-radius:40px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

#yes{
    background:#ff2d55;
    color:white;
    box-shadow:0 0 20px #ff2d55;
}

#yes:hover{
    transform:scale(1.1);
}

#no{
    position:absolute;
    left:220px;
    background:white;
}

#result{
    margin-top:25px;
    font-size:28px;
    color:#fff;
    font-weight:bold;
}

.heart{
    position:absolute;
    color:#ff5e7e;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.5);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) scale(2);
        opacity:0;
    }
}
</style>

</head>
<body>

<div class="card">

<h1>❤️ Hey...</h1>

<div id="typing"></div>

<div class="buttons">
<button id="yes">Yes ❤️</button>
<button id="no">No 🙈</button>
</div>

<div id="result"></div>

</div>

<script>

const text="From the moment I met you, everything became brighter. Every smile, every conversation, every little moment with you means more than you know.\n\nI don't know what the future holds... but I know I'd love to have you in mine.\n\nWill you be my girlfriend? ❤️";

let i=0;

function type(){
    if(i<text.length){
        document.getElementById("typing").innerHTML+=text.charAt(i);
        i++;
        setTimeout(type,45);
    }
}
type();

const no=document.getElementById("no");

no.addEventListener("mouseover",function(){

let x=Math.random()*(window.innerWidth-150);
let y=Math.random()*(window.innerHeight-100);

no.style.position="fixed";
no.style.left=x+"px";
no.style.top=y+"px";

});

document.getElementById("yes").onclick=function(){

document.querySelector(".buttons").style.display="none";

document.getElementById("result").innerHTML="❤️ You just made me the happiest person alive! ❤️";

for(let i=0;i<150;i++){

let heart=document.createElement("div");

heart.innerHTML="❤️";

heart.className="heart";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(Math.random()*25+15)+"px";

heart.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(heart);

}

}

</script>

</body>
</html>
